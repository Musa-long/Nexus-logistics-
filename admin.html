<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin NX</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-6"><div class="max-w-2xl mx-auto">
<h1 class="text-2xl font-black mb-4">NX ADMIN - Create Shipment</h1>
<div class="bg-[#1e1e1e] p-6 rounded-2xl grid gap-3">
<input id="tracking" placeholder="Tracking Code NX101010" class="p-3 rounded bg-black border border-white/20">
<input id="senderName" placeholder="Sender Name" class="p-3 rounded bg-black border border-white/20">
<input id="senderPhone" placeholder="Sender Phone" class="p-3 rounded bg-black border border-white/20">
<input id="receiverName" placeholder="Receiver Name" class="p-3 rounded bg-black border border-white/20">
<input id="receiverPhone" placeholder="Receiver Phone e.g 09167452777" class="p-3 rounded bg-black border border-green-500">
<input id="weight" placeholder="Weight e.g 5kg" class="p-3 rounded bg-black border border-white/20">
<div class="grid grid-cols-2 gap-3">
<select id="status" class="p-3 rounded bg-black border border-white/20"><option>In Transit</option><option>Shipped</option><option>Arrived Lagos</option><option>Out for Delivery</option><option>Delivered</option></select>
<input id="location" value="Lagos Hub" class="p-3 rounded bg-black border border-white/20">
</div>
<div class="grid grid-cols-2 gap-3"><input id="origin" value="USA" class="p-3 rounded bg-black border border-white/20"><input id="destination" value="Nigeria" class="p-3 rounded bg-black border border-white/20"></div>
<input id="eta" placeholder="Estimated Delivery e.g Nov 15 2025" class="p-3 rounded bg-black border border-white/20">
<input id="fee" placeholder="Fee e.g #5000 / Paid" class="p-3 rounded bg-black border border-white/20">
<button onclick="createShipment()" id="btn" class="bg-orange-600 py-4 rounded-full font-black mt-2">Create Shipment</button>
<p id="msg"></p>
</div>
<script>
const API = location.origin;
async function createShipment(){
 const data={
  trackingId:document.getElementById('tracking').value.trim(),
  senderName:document.getElementById('senderName').value,
  senderPhone:document.getElementById('senderPhone').value,
  receiverName:document.getElementById('receiverName').value,
  receiverPhone:document.getElementById('receiverPhone').value,
  weight:document.getElementById('weight').value,
  status:document.getElementById('status').value,
  currentLocation:document.getElementById('location').value,
  origin:document.getElementById('origin').value,
  destination:document.getElementById('destination').value,
  eta:document.getElementById('eta').value,
  fee:document.getElementById('fee').value,
  timeline:[{date:new Date().toLocaleString(), status:document.getElementById('status').value, location:document.getElementById('location').value}]
 };
 if(!data.trackingId||!data.receiverName){alert('Need tracking + receiver');return;}
 document.getElementById('btn').innerText='Saving...';
 const r=await fetch(`${API}/api/shipments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const j=await r.json(); document.getElementById('msg').innerText=j.message; document.getElementById('btn').innerText='Create Shipment';
}
</script>
</div></body></html>
