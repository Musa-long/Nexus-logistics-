<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS LOGISTICS - Track Shipment</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#0b2a5a;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
header img{height:40px;background:white;border-radius:5px}
.box{max-width:600px;margin:20px auto;background:white;padding:20px;border-radius:10px}
.bank{background:#fff8c5;border:1px solid #e6c200;padding:15px;border-radius:8px;margin-top:20px}
.whatsapp{text-align:center;margin-top:15px}
.whatsapp a{background:#25D366;color:white;padding:12px 20px;border-radius:30px;text-decoration:none;font-weight:bold;display:inline-block}
input{width:70%;padding:12px} button{width:25%;padding:12px;background:#0b2a5a;color:white;border:none}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <img src="img1.jpg" alt="logo"> <!-- your logo, use img1.jpg as logo for now -->
    <b>NEXUS LOGISTICS</b>
  </div>
  <a href="admin.html" style="color:white">Admin</a>
</header>

<div class="box">
  <h2>Track Your Shipment</h2>
  <input id="tid" placeholder="Enter Tracking ID e.g NEXUS-123">
  <button onclick="track()">Track</button>
  <div id="result" style="margin-top:20px"></div>

  <div class="bank">
    <h3>💳 Payment Details (OFFICIAL)</h3>
    <p><b>Bank:</b> Sterling Bank</p>
    <p><b>Acc No:</b> 8387778364</p>
    <p><b>Acc Name:</b> MFY/DATA 247 COMMUNICATION LTD</p>
    <p style="color:red;font-size:13px">Pay only to this account. Send proof to Customer Care.</p>
  </div>

  <div class="whatsapp">
    <p><b>Customer Care WhatsApp</b></p>
    <a href="https://wa.me/2349167452777">Chat +2349167452777</a>
  </div>
</div>

<script>
async function track(){
  const id = document.getElementById('tid').value;
  if(!id) return alert('Enter ID');
  document.getElementById('result').innerHTML = 'Loading...';
  try{
    const res = await fetch('/api/track/'+id);
    const data = await res.json();
    document.getElementById('result').innerHTML = `<b>${data.trackingId}</b><br>Status: ${data.status}<br>Location: ${data.currentLocation}`;
  }catch(e){
    document.getElementById('result').innerHTML = 'Error - Backend waking up, try again in 20 sec';
  }
}
</script>
</body>
</html>
